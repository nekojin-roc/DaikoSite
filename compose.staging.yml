# Isolated staging database; shares ParcelHub identity service but no data volume
# with production Daiko. Cloudflare Tunnel should target 127.0.0.1:3334.
name: daiko-staging
services:
  staging-api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/app/data/daiko.db
      DAIKO_EVENT_IMAGE_DIR: /app/data/event-images
      DAIKO_REQUEST_IMAGE_DIR: /app/data/request-images
      PARCELHUB_URL: http://parcelhub-server-1:3001
      DAIKO_BROWSER_IMPORT_URL: http://livepocket-browser:3003/import
      DAIKO_ADMIN_EMAILS: ${DAIKO_ADMIN_EMAILS:?Set DAIKO_ADMIN_EMAILS in a private env file}
      DAIKO_ALLOWED_ORIGINS: https://daiko.nekoj.in
      HOST: 0.0.0.0
      PORT: "3002"
    volumes:
      - staging-data:/app/data
    networks:
      default:
        aliases: [daiko-staging-api]
      browser-internal: {}
  livepocket-browser:
    build:
      context: ./browser-service
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    shm_size: 256m
    mem_limit: 1g
    pids_limit: 256
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp:./deploy/browser-seccomp.json
    networks:
      browser-internal: {}
  browser-proxy:
    build:
      context: ./browser-proxy
    restart: unless-stopped
    init: true
    read_only: true
    mem_limit: 128m
    pids_limit: 64
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      browser-internal: {}
      browser-egress: {}
  staging-web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.client
    restart: unless-stopped
    depends_on: [staging-api]
    ports:
      - "127.0.0.1:3334:80"
    volumes:
      - ./deploy/staging-app-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default: {}
volumes:
  staging-data:
networks:
  default:
    external: true
    name: parcelhub_default
  browser-internal:
    internal: true
  browser-egress: {}

