server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow multipart overhead around ParcelHub's 5 MiB photo limit.
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

# Add these locations inside ParcelHub's existing server block. Dynamic DNS
# prevents a stopped Daiko service from preventing ParcelHub Nginx startup.
resolver 127.0.0.11 valid=10s ipv6=off;
location = /daiko { return 308 /daiko/; }
location /daiko/ {
    set $daiko_web http://daiko-web:80;
    proxy_pass $daiko_web$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
location /daiko-api/ {
    set $daiko_web http://daiko-web:80;
    proxy_pass $daiko_web$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

    location / {
        try_files $uri $uri/ /index.html;
    }
}

