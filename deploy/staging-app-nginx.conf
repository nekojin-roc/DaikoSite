server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = / { return 308 /daiko/; }
    location = /daiko { return 308 /daiko/; }
    location /daiko/ { try_files $uri $uri/ /daiko/index.html; }

    location /daiko-api/ {
        set $staging_api http://daiko-staging-api:3002;
        rewrite ^/daiko-api/(.*)$ /api/$1 break;
        proxy_pass $staging_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Only the two authentication actions used by the UI are exposed. The
    # browser Origin is checked before forwarding as ParcelHub's own origin.
    location = /api/auth/sign-in/email {
        limit_except POST { deny all; }
        if ($http_origin != "https://daiko.nekoj.in") { return 403; }
        set $parcelhub http://parcelhub-server-1:3001;
        proxy_pass $parcelhub$request_uri;
        proxy_set_header Host parcelhub.nekoj.in;
        proxy_set_header Origin https://parcelhub.nekoj.in;
        proxy_set_header X-Forwarded-Host parcelhub.nekoj.in;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/auth/sign-out {
        limit_except POST { deny all; }
        if ($http_origin != "https://daiko.nekoj.in") { return 403; }
        set $parcelhub http://parcelhub-server-1:3001;
        proxy_pass $parcelhub$request_uri;
        proxy_set_header Host parcelhub.nekoj.in;
        proxy_set_header Origin https://parcelhub.nekoj.in;
        proxy_set_header X-Forwarded-Host parcelhub.nekoj.in;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/auth/ { return 404; }
}

