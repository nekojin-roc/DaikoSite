server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Preserve old bookmarks while keeping every app page at the site root.
    location = /daiko { return 308 /; }
    location ^~ /daiko/ { rewrite ^/daiko/(.*)$ /$1 permanent; }
    location / { try_files $uri $uri/ /index.html; }

    location /daiko-api/ {
        client_max_body_size 8m;
        set $staging_api http://daiko-staging-api:3002;
        rewrite ^/daiko-api/(.*)$ /api/$1 break;
        proxy_pass $staging_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ParcelHub may establish a Daiko session after registration. Only these
    # two trusted origins can call sign-in; credentials stay in the POST body.
    location = /api/auth/sign-in/email {
        set $allowed_auth_origin "";
        if ($http_origin ~ "^https://(daiko|parcelhub)\.nekoj\.in$") { set $allowed_auth_origin $http_origin; }
        if ($allowed_auth_origin = "") { return 403; }
        add_header Access-Control-Allow-Origin $allowed_auth_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers Content-Type always;
        add_header Vary Origin always;
        if ($request_method = OPTIONS) { return 204; }
        limit_except POST OPTIONS { deny all; }
        set $parcelhub http://parcelhub-server-1:3001;
        proxy_pass $parcelhub$request_uri;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_set_header Host parcelhub.nekoj.in;
        proxy_set_header Origin https://parcelhub.nekoj.in;
        proxy_set_header X-Forwarded-Host parcelhub.nekoj.in;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/auth/sign-out {
        limit_except POST { deny all; }
        if ($http_origin != "https://daiko.nekoj.in") { return 403; }
        set $parcelhub http://parcelhub-server-1:3001;
        proxy_pass $parcelhub$request_uri;
        proxy_set_header Host parcelhub.nekoj.in;
        proxy_set_header Origin https://parcelhub.nekoj.in;
        proxy_set_header X-Forwarded-Host parcelhub.nekoj.in;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/auth/ { return 404; }
}

