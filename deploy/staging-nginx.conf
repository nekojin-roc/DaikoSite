server {
    listen 80;
    server_name _;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    location / {
        return 200 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work in progress</title><style>html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#fafafa;color:#202938;font:500 18px system-ui,sans-serif}</style></head><body>Work in progress.</body></html>';
    }
}
